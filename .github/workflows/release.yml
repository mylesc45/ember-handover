name: Release

# Publishes the CLI to npm with provenance via trusted publishing (OIDC).
# No npm tokens are stored in this repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack CLI (resolves workspace protocol, bundles internal packages)
        working-directory: packages/cli
        run: pnpm pack --out "$RUNNER_TEMP/ember-handover.tgz"
      - name: Upgrade npm (trusted publishing needs npm 11.5.1+)
        run: npm install --global npm@11
      - name: Publish with provenance
        run: npm publish "$RUNNER_TEMP/ember-handover.tgz" --provenance --access public --tag next
